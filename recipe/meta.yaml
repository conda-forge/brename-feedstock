{% set name = "brename" %}
{% set version = "2.15.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/shenwei356/brename/archive/v{{ version }}.tar.gz
  sha256: ad957eea95c7b1f8283a08c46f7128e0f944d29e139bf63557da17f1906b47df

build:
  number: 0

requirements:
  build:
    - {{ compiler('go-nocgo') }}
    - go-licenses

test:
  commands:
    - brename --help

about:
  home: https://github.com/shenwei356/brename
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: A cross-platform command-line tool for safely batch renaming via regular expressions

extra:
  recipe-maintainers:
    - shenwei356
    - apcamargo
